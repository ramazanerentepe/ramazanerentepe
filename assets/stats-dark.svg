<svg xmlns="http://www.w3.org/2000/svg" width="960" height="296" viewBox="0 0 960 296" role="img" aria-label="GitHub istatistikleri">
  <title>GitHub istatistikleri</title>
  <defs>
    <linearGradient id="statsd-border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="296">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        values="0 480.0 148.0;360 480.0 148.0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="statsd-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="statsd-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="statsd-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="statsd-win"><rect x="10" y="10" width="940" height="276" rx="16"/></clipPath>
    <g id="statsd-blobs" filter="url(#statsd-blur)" opacity="0">
      <circle cx="144.0" cy="59.2" r="103.6" fill="#7c3aed">
        <animate attributeName="cx" values="144.0;336.0;144.0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="816.0" cy="251.6" r="118.4" fill="#06b6d4">
        <animate attributeName="cy" values="251.6;88.8;251.6" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="528.0" cy="29.6" r="74" fill="#db2777">
        <animate attributeName="cx" values="528.0;672.0;528.0" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g></defs>

  <g clip-path="url(#statsd-win)">
    
    <rect x="10" y="10" width="940" height="276" fill="#0d1117"/>
  </g>
  <rect x="10" y="10" width="940" height="276" rx="16" fill="none"
        stroke="url(#statsd-border)" stroke-width="3" opacity="0.6" filter="url(#statsd-glow)"/>
  <rect x="10.75" y="10.75" width="938.5" height="274.5" rx="15.5" fill="none"
        stroke="url(#statsd-border)" stroke-width="1.5"/>
  <rect x="11" y="11" width="938" height="40" rx="15" fill="rgba(255,255,255,0.04)"/>
  <line x1="11" y1="51" x2="949" y2="51" stroke="rgba(255,255,255,0.10)"/>
  <circle cx="34" cy="31" r="6" fill="#ff5f57"/><circle cx="54" cy="31" r="6" fill="#febc2e"/><circle cx="74" cy="31" r="6" fill="#28c840"/>
  <text x="480.0" y="35" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#7d8590">ramazanerentepe@github: ~/stats</text>
  <line x1="480.0" y1="78" x2="480.0" y2="266" stroke="rgba(255,255,255,0.10)" stroke-dasharray="3 5"/>
  <g font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13">
