ue</text><text x="294" y="228" fill="#e6edf3" font-weight="700">10</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.78s" dur="0.4s" fill="freeze"/><g transform="translate(44 248)" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" color="#a78bfa"><path d="M3 13.5V3a1.5 1.5 0 0 1 1.5-1.5H13.5V12H4.5A1.5 1.5 0 0 0 3 13.5a1.5 1.5 0 0 0 1.5 1.5H13.5"/></g><text x="72" y="260" fill="#22d3ee" font-weight="700">Katkı Verilen Repo</text><text x="294" y="260" fill="#e6edf3" font-weight="700">7</text></g>
    <text x="512" y="92" fill="#34d399" font-weight="700">~ <tspan fill="#a78bfa">Repo Bazında Diller</tspan></text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.4s" fill="freeze"/><rect x="512" y="120" width="14" height="14" rx="3" fill="#3572A5"/><text x="536" y="132" fill="#e6edf3">Python</text><text x="702" y="132" fill="#7d8590" text-anchor="end">3 repo</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.54s" dur="0.4s" fill="freeze"/><rect x="512" y="150" width="14" height="14" rx="3" fill="#f34b7d"/><text x="536" y="162" fill="#e6edf3">C++</text><text x="702" y="162" fill="#7d8590" text-anchor="end">2 repo</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.66s" dur="0.4s" fill="freeze"/><rect x="512" y="180" width="14" height="14" rx="3" fill="#b07219"/><text x="536" y="192" fill="#e6edf3">Java</text><text x="702" y="192" fill="#7d8590" text-anchor="end">1 repo</text></g>
    <circle cx="821" cy="168" r="64" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="22"/><circle cx="821" cy="168" r="64" fill="none" stroke="#3572A5" stroke-width="22" stroke-dasharray="0 402.12" stroke-dashoffset="-0" transform="rotate(-90 821 168)"><animate attributeName="stroke-dasharray" from="0 402.12" to="198.56 402.12" begin="0.4s" dur="0.6s" fill="freeze"/></circle><circle cx="821" cy="168" r="64" fill="none" stroke="#f34b7d" stroke-width="22" stroke-dasharray="0 402.12" stroke-dashoffset="-201.06" transform="rotate(-90 821 168)"><animate attributeName="stroke-dasharray" from="0 402.12" to="131.54 402.12" begin="0.58s" dur="0.6s" fill="freeze"/></circle><circle cx="821" cy="168" r="64" fill="none" stroke="#b07219" stroke-width="22" stroke-dasharray="0 402.12" stroke-dashoffset="-335.1" transform="rotate(-90 821 168)"><animate attributeName="stroke-dasharray" from="0 402.12" to="64.52 402.12" begin="0.76s" dur="0.6s" fill="freeze"/></circle><text x="821" y="166" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="800">6</text><text x="821" y="184" text-anchor="middle" fill="#7d8590" font-size="11">repo</text>
  </g>
</svg>
